services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - socialsphere_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/socialsphere
      JWT_SECRET: local-docker-development-secret-change-before-public-deployment
      CLIENT_URL: http://localhost:5000
      SERVE_CLIENT: "true"

volumes:
  socialsphere_mongo:
